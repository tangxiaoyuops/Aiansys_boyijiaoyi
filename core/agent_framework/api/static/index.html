<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通用自主规划Agent框架 - 博弈交易分析系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #dc3545;
        }

        .status-dot.active {
            background: #28a745;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .panel h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .config-section {
            margin-bottom: 20px;
        }

        .config-section label {
            display: block;
            color: #555;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .config-section input, .config-section select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .config-section input:focus, .config-section select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .task-input {
            margin-bottom: 20px;
        }

        .task-input textarea {
            width: 100%;
            min-height: 120px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            resize: vertical;
            font-family: inherit;
        }

        .task-input textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .tool-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid transparent;
            transition: all 0.3s;
            cursor: pointer;
        }

        .tool-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .tool-card h3 {
            color: #667eea;
            font-size: 1em;
            margin-bottom: 8px;
        }

        .tool-card p {
            color: #666;
            font-size: 0.85em;
            line-height: 1.4;
        }

        .tool-card .tag {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75em;
            margin-top: 8px;
        }

        .result-area {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            min-height: 300px;
            max-height: 600px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .result-area h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .result-content {
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            color: #333;
        }

        .execution-trace {
            margin-top: 20px;
        }

        .trace-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .trace-item h4 {
            color: #667eea;
            margin-bottom: 8px;
        }

        .trace-item p {
            color: #666;
            font-size: 0.9em;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .quick-tasks {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .quick-task-btn {
            padding: 8px 15px;
            background: #e9ecef;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .quick-task-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>🤖 通用自主规划Agent框架</h1>
            <p>基于ReAct循环的博弈交易分析系统 - 支持工具调用、嵌套Agent、动态规划</p>
            
            <div class="status-bar">
                <div class="status-item">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">未配置</span>
                </div>
                <div class="status-item">
                    <span>工具数量: <strong id="toolsCount">0</strong></span>
                </div>
                <div class="status-item">
                    <span>Agent: <strong id="agentName">-</strong></span>
                </div>
            </div>
        </div>

        <!-- 主要内容 -->
        <div class="main-content">
            <!-- 左侧: 配置和任务 -->
            <div class="panel">
                <h2>⚙️ 配置Agent</h2>
                
                <div class="config-section">
                    <label>OpenAI API Key *</label>
                    <input type="password" id="apiKey" placeholder="sk-..." />
                </div>

                <div class="config-section">
                    <label>模型</label>
                    <select id="model">
                        <option value="gpt-4o">GPT-4o (推荐)</option>
                        <option value="gpt-4-turbo">GPT-4 Turbo</option>
                        <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                    </select>
                </div>

                <div class="config-section">
                    <label>API Base URL (可选)</label>
                    <input type="text" id="baseUrl" placeholder="https://api.openai.com/v1" />
                </div>

                <button class="btn btn-primary" id="configBtn" onclick="configureAgent()">
                    配置Agent
                </button>

                <div id="configResult"></div>
            </div>

            <!-- 右侧: 工具列表 -->
            <div class="panel">
                <h2>🛠️ 可用工具</h2>
                <div class="tools-grid" id="toolsGrid">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>加载工具中...</p>
                    </div>
                </div>
            </div>

            <!-- 任务输入 -->
            <div class="panel full-width">
                <h2>📝 分析任务</h2>
                
                <div class="task-input">
                    <label>任务描述:</label>
                    <textarea id="taskInput" placeholder="输入您的分析任务,例如:&#10;- 分析股票000001,判断当前阶段&#10;- 识别股票000001的洗盘特征&#10;- 给出股票000001的买卖建议"></textarea>
                </div>

                <div class="config-section">
                    <label>最大迭代次数</label>
                    <input type="number" id="maxIterations" value="10" min="1" max="50" />
                </div>

                <div>
                    <label>快速任务:</label>
                    <div class="quick-tasks">
                        <button class="quick-task-btn" onclick="setQuickTask('分析股票000001,判断当前所处的阶段')">阶段分析</button>
                        <button class="quick-task-btn" onclick="setQuickTask('分析股票000001,识别洗盘特征')">洗盘识别</button>
                        <button class="quick-task-btn" onclick="setQuickTask('分析股票000001,给出买卖建议')">买卖建议</button>
                        <button class="quick-task-btn" onclick="setQuickTask('完整分析股票000001')">完整分析</button>
                    </div>
                </div>

                <button class="btn btn-success" id="analyzeBtn" onclick="executeAnalysis()" disabled>
                    开始分析
                </button>
            </div>

            <!-- 结果显示 -->
            <div class="panel full-width">
                <h2>📊 分析结果</h2>
                
                <div id="resultArea" class="result-area">
                    <div class="alert alert-info">
                        请先配置Agent,然后输入任务开始分析
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isConfigured = false;

        // 页面加载时获取工具列表
        window.onload = async function() {
            await loadTools();
            checkHealth();
        };

        // 加载工具列表
        async function loadTools() {
            try {
                const response = await fetch('/api/tools');
                const data = await response.json();
                
                const toolsGrid = document.getElementById('toolsGrid');
                toolsGrid.innerHTML = '';
                
                data.tools.forEach(tool => {
                    const card = document.createElement('div');
                    card.className = 'tool-card';
                    card.innerHTML = `
                        <h3>${tool.name}</h3>
                        <p>${tool.description}</p>
                        <span class="tag">${tool.type}</span>
                    `;
                    toolsGrid.appendChild(card);
                });
                
                document.getElementById('toolsCount').textContent = data.total;
            } catch (error) {
                console.error('加载工具失败:', error);
            }
        }

        // 检查健康状态
        async function checkHealth() {
            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                
                if (data.agent_configured) {
                    isConfigured = true;
                    updateStatus(true);
                    document.getElementById('agentName').textContent = 'boyi_master';
                    document.getElementById('analyzeBtn').disabled = false;
                }
            } catch (error) {
                console.error('健康检查失败:', error);
            }
        }

        // 配置Agent
        async function configureAgent() {
            const apiKey = document.getElementById('apiKey').value;
            const model = document.getElementById('model').value;
            const baseUrl = document.getElementById('baseUrl').value;

            if (!apiKey) {
                alert('请输入API Key');
                return;
            }

            const configBtn = document.getElementById('configBtn');
            const configResult = document.getElementById('configResult');
            
            configBtn.disabled = true;
            configResult.innerHTML = '<div class="alert alert-info">配置中...</div>';

            try {
                const response = await fetch('/api/config', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        api_key: apiKey,
                        model: model,
                        base_url: baseUrl || null
                    })
                });

                const data = await response.json();

                if (data.success) {
                    isConfigured = true;
                    updateStatus(true);
                    document.getElementById('agentName').textContent = 'boyi_master';
                    document.getElementById('analyzeBtn').disabled = false;
                    
                    configResult.innerHTML = `
                        <div class="alert alert-success">
                            ✅ Agent配置成功! 已加载 ${data.tools_count} 个工具
                        </div>
                    `;
                } else {
                    throw new Error(data.message || '配置失败');
                }
            } catch (error) {
                configResult.innerHTML = `
                    <div class="alert alert-error">
                        ❌ 配置失败: ${error.message}
                    </div>
                `;
            } finally {
                configBtn.disabled = false;
            }
        }

        // 执行分析
        async function executeAnalysis() {
            if (!isConfigured) {
                alert('请先配置Agent');
                return;
            }

            const task = document.getElementById('taskInput').value.trim();
            if (!task) {
                alert('请输入任务描述');
                return;
            }

            const maxIterations = parseInt(document.getElementById('maxIterations').value);
            const analyzeBtn = document.getElementById('analyzeBtn');
            const resultArea = document.getElementById('resultArea');

            analyzeBtn.disabled = true;
            resultArea.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>正在分析中,请稍候...</p>
                    <p>任务: ${task}</p>
                </div>
            `;

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        task: task,
                        max_iterations: maxIterations
                    })
                });

                const data = await response.json();

                if (data.success) {
                    displayResult(data);
                } else {
                    throw new Error(data.message || '分析失败');
                }
            } catch (error) {
                resultArea.innerHTML = `
                    <div class="alert alert-error">
                        ❌ 分析失败: ${error.message}
                    </div>
                `;
            } finally {
                analyzeBtn.disabled = false;
            }
        }

        // 显示结果
        function displayResult(data) {
            const resultArea = document.getElementById('resultArea');
            
            let html = `
                <div class="alert alert-success">
                    ✅ 分析完成! 迭代次数: ${data.iterations}
                </div>
                
                <div style="margin-top: 20px;">
                    <h3>最终响应</h3>
                    <div class="result-content">${data.response}</div>
                </div>
            `;

            // 执行轨迹
            if (data.execution_trace && data.execution_trace.length > 0) {
                html += `
                    <div class="execution-trace">
                        <h3>执行轨迹</h3>
                `;
                
                data.execution_trace.forEach((trace, index) => {
                    const decision = trace.decision || {};
                    const result = trace.result || {};
                    
                    html += `
                        <div class="trace-item">
                            <h4>第 ${index + 1} 轮</h4>
                            <p><strong>思考:</strong> ${(decision.thinking || '').substring(0, 100)}...</p>
                            <p><strong>行动:</strong> ${decision.action?.tool || 'none'}</p>
                            <p><strong>状态:</strong> ${result.status || 'unknown'}</p>
                            <p><strong>时间:</strong> ${result.execution_time?.toFixed(2) || 0}秒</p>
                        </div>
                    `;
                });
                
                html += `</div>`;
            }

            resultArea.innerHTML = html;
        }

        // 更新状态
        function updateStatus(active) {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            
            if (active) {
                statusDot.classList.add('active');
                statusText.textContent = '已就绪';
            } else {
                statusDot.classList.remove('active');
                statusText.textContent = '未配置';
            }
        }

        // 设置快速任务
        function setQuickTask(task) {
            document.getElementById('taskInput').value = task;
        }
    </script>
</body>
</html>
